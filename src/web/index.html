<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit · 基因组浏览器</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234b5563'/><path d='M9 8h4v16H9zM19 8h4v16h-4z' fill='white'/><path d='M9 12h14M9 20h14' stroke='white' stroke-width='2'/></svg>">
</head>
<body data-theme="light">

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#lg)"/>
      <!-- 轨道：倾斜的椭圆环 -->
      <ellipse cx="16" cy="16" rx="11.2" ry="5.4" fill="none" stroke="#fff"
               stroke-width="1.3" opacity=".5" transform="rotate(-30 16 16)"/>
      <!-- 染色体带（着丝粒在中间） -->
      <rect x="12.2" y="14.75" width="7.6" height="2.5" rx="1.25" fill="#fff" opacity=".95"/>
      <!-- 行星：落在轨道上，避开中心以免糊成一团 -->
      <circle cx="25.6" cy="10.3" r="1.8" fill="#fff"/>
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#374151"/>
      </linearGradient></defs>
    </svg>
    <span class="brand-txt">Orbit</span>
  </div>

  <div class="asm" id="asm">
    <button class="asm-btn" id="asmBtn" aria-haspopup="listbox">
      <span class="dot" id="asmDot"></span>
      <span id="asmName">加载中…</span>
      <svg viewBox="0 0 12 12" class="chev"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="asm-menu" id="asmMenu" role="listbox"></div>
  </div>

  <div class="locus-wrap">
    <div class="locus-box">
      <svg class="ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="locus" autocomplete="off" spellcheck="false"
             placeholder="搜索基因 / 位置"
             title="支持：基因名（TP53）、位置（chr7:55,000,000-55,200,000）、多个用逗号分隔（TP53, BRCA1）">
      <kbd>/</kbd>
    </div>
    <div class="suggest" id="suggest" hidden></div>
  </div>

  <div class="gtf-wrap" id="gtfWrap" hidden>
    <div class="gtf-box">
      <span class="gtf-tag" title="从导入的 GTF / GFF 注释里搜索基因">GTF</span>
      <input id="gtfInput" autocomplete="off" spellcheck="false"
             placeholder="在导入的注释中搜索基因"
             title="从导入的 GTF / GFF 注释里搜索基因并跳转">
      <select id="gtfTrackSel" class="gtf-track-sel" title="选择搜索范围（全部轨道或指定轨道）">
        <option value="all">全部轨道</option>
      </select>
    </div>
    <div class="suggest gtf-suggest" id="gtfSuggest" hidden></div>
  </div>

  <div class="nav">
    <button class="nbtn import" id="btnImport" title="导入文件：bigWig / bedGraph / BAM / GTF / FASTA（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V3M4.5 6.5 8 3l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      导入
    </button>
    <div class="split">
      <button class="nbtn" id="btnSplit" title="多位置分屏：同时看多个基因（每屏可独立导航）">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="3.4" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="6.3" y="3" width="3.4" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10.6" y="3" width="3.4" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        分屏
      </button>
      <div class="split-menu" id="splitMenu" hidden></div>
    </div>
    <div class="split" id="expWrap">
      <button class="nbtn" id="btnExport" title="导出当前视图：PNG（位图）/ SVG、PDF（矢量，可在 Illustrator 里编辑）">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v8M4.5 7.5 8 11l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        导出
      </button>
      <div class="split-menu" id="expMenu" hidden></div>
    </div>
    <button class="nbtn" id="btnMotif" title="查找 motif：在视野内搜核苷酸序列 / IUPAC 简并碱基 / 正则，正负链各一条轨道（同 IGV 的 Tools → Find Motif）">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.3 10.3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.9 5.6h4.2M4.9 8.4h4.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".75"/></svg>
      Motif
    </button>
    <button class="nbtn" id="btnHome" title="整条染色体 (Home)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      全染色体
    </button>
    <button class="nbtn sq" id="btnOut" title="缩小 (-)">−</button>
    <button class="nbtn sq" id="btnIn" title="放大 (+)">+</button>
  </div>

  <button class="nbtn sq ghost" id="btnTheme" title="切换主题" aria-label="切换浅色 / 深色主题">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 1.4v1.8M8 12.8v1.8M1.4 8h1.8M12.8 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main>
  <aside class="sidebar" id="sidebar">
    <!-- 1. 已导入（高频，置顶） -->
    <div class="side-sec" id="loadedSec" hidden>
      <div class="side-title">已导入</div>
      <div id="loadedList"></div>
      <div class="side-hint">勾选显示 · 点名称选轨（Ctrl 多选）· 右键批量删除</div>
    </div>

    <!-- 2. 信号轨道 -->
    <div class="side-sec" id="bwSec" hidden>
      <div class="side-title">信号轨道 · bigWig</div>
      <div id="bwList"></div>
      <div class="side-hint">点名称选轨（Ctrl 多选）· 右键可统一纵轴 / 统一颜色</div>
    </div>

    <!-- 3. 选择 / 详情（主位：flex:1，至少 240px） -->
    <div class="side-sec grow" id="selSec">
      <div class="side-title">选择 / 详情</div>
      <div class="info" id="info">
        <p class="muted">点击基因查看转录本详情</p>
      </div>
    </div>

    <!-- 4. 轨道开关（默认折叠，低频） -->
    <div class="side-sec" id="tracksSec">
      <button class="sec-toggle" id="tracksToggle" aria-expanded="false" aria-controls="tracksBody">
        <span class="side-title">轨道</span><span class="chev">▸</span>
      </button>
      <div class="sec-body" id="tracksBody" hidden>
        <label class="trk"><input type="checkbox" data-track="ideogram" checked><span>染色体示意图</span></label>
        <label class="trk"><input type="checkbox" data-track="ruler" checked><span>标尺</span></label>
        <label class="trk"><input type="checkbox" data-track="genes" checked><span>RefSeq 基因</span></label>
        <label class="trk"><input type="checkbox" data-track="gc"><span>GC 含量</span></label>
        <label class="trk"><input type="checkbox" data-track="seq"><span>序列</span></label>
        <label class="trk"><input type="checkbox" data-track="overview" checked><span>全基因组总览</span></label>
      </div>
    </div>

    <!-- 5. 染色体（默认一行 chip，点开才展开 25 条全表） -->
    <div class="side-sec" id="chromSec">
      <div class="side-title">染色体</div>
      <button class="chrom-chip" id="chromChip" aria-expanded="false" aria-controls="chromList">
        <span>—</span><span class="chev">▾</span>
      </button>
      <div class="chrom-list" id="chromList" hidden></div>
    </div>
  </aside>

  <section class="view" id="view">
    <div class="track" data-track="ideogram">
      <div class="track-label">染色体<div class="sub" id="ideoChrom"></div></div>
      <div class="track-body" data-split><canvas></canvas></div>
    </div>
    <!-- 分屏的位置输入行：位置固定，不参与拖动排序 -->
    <div class="track pane-head" id="paneHead" data-tkey="s:panehead" data-fixed hidden>
      <div class="track-label">位置</div>
      <div class="track-body phs" id="paneHeads"></div>
    </div>
    <div class="track" data-track="ruler">
      <div class="track-label">标尺</div>
      <div class="track-body" data-split><canvas></canvas></div>
    </div>
    <div class="track" data-track="genes">
      <div class="track-label">RefSeq<div class="sub" id="geneCount"></div>
        <button class="tgear" data-gear="genes" title="轨道设置">⚙</button></div>
      <div class="track-body" data-split><canvas></canvas></div>
    </div>
    <div class="track" data-track="gc">
      <div class="track-label">GC<div class="sub">30–70%</div>
        <button class="tgear" data-gear="gc" title="轨道设置">⚙</button></div>
      <div class="track-body" data-split><canvas></canvas></div>
    </div>
    <div class="track" data-track="seq">
      <div class="track-label">序列<div class="sub" id="seqHint"></div>
        <button class="sflip s2" id="seqTrans" data-trans="1" aria-pressed="false"
                title="显示氨基酸翻译（可切换遗传密码表）">Aa</button>
        <button class="sflip" id="seqFlip" aria-pressed="false"
                title="翻转链：显示互补链（同 IGV 序列轨道的 Flip strand）">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.6 5.1h10.2M10.6 3.1l2.2 2-2.2 2" fill="none"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13.4 10.9H3.2M5.4 8.9l-2.2 2 2.2 2" fill="none"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button></div>
      <div class="track-body" data-split><canvas></canvas></div>
    </div>
    <div class="track" data-track="overview">
      <div class="track-label">全基因组<div class="sub" id="ovSub">点击展开全部</div>
        <button class="ov-toggle" id="ovToggle" aria-pressed="false"
                title="展开 / 收起全基因组总览">▾</button></div>
      <div class="track-body" data-split><canvas></canvas></div>
    </div>
    <div class="empty" id="empty" hidden></div>
  </section>
</main>

<footer class="statusbar">
  <span id="stLocus">—</span>
  <span class="sep"></span>
  <span id="stWindow"></span>
  <span class="sep"></span>
  <span id="stScale"></span>
  <span class="spacer"></span>
  <span id="stAsm" class="muted"></span>
  <span class="sep"></span>
  <span id="stPerf" class="muted" title="本次数据请求耗时"></span>
</footer>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<!-- 导入进度：上传 → 解析 → 完成（GTF 等大文件解析时能明确看到进度/结束） -->
<div class="imp-panel" id="impPanel" hidden>
  <div class="imp-head">
    <span class="imp-ico" id="impIco">↑</span>
    <span class="imp-name" id="impName">导入中…</span>
    <button class="imp-x" id="impX" title="隐藏">×</button>
  </div>
  <div class="imp-bar"><span id="impBar"></span></div>
  <div class="imp-status" id="impStatus"></div>
</div>
<div class="tpop" id="tpop" hidden></div>
<div class="tpop" id="transPop" hidden></div>
<div class="tpop ctx" id="bwCtx" hidden></div>
<div class="tpop ctx" id="loadedCtx" hidden></div>

<!-- 查找 motif（对应 IGV 的 Tools → Find Motif） -->
<div class="modal" id="motifDlg" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="motifTitle">
    <div class="modal-head">
      <span id="motifTitle">查找 motif</span>
      <button class="modal-x" id="motifX" title="关闭">×</button>
    </div>
    <div class="modal-body">
      <label class="modal-lbl" for="motifPattern">搜索模式</label>
      <textarea id="motifPattern" rows="2" spellcheck="false" autocomplete="off"
                placeholder="ACCGCT / AARNNR / TATAAA(A){3,}"></textarea>
      <p class="modal-hint">
        可填核苷酸序列（ACCGCT）、带 IUPAC 简并碱基的序列（AARNNR），或正则表达式（TATAAA(A){3,}）。
        <b>一行一个</b>，每行生成一对正链 / 负链轨道。只在当前视野里查找；视野超过 1 Mb 时轨道自动隐藏（同 IGV）。
      </p>
      <div class="modal-row">
        <label for="motifPos">正链轨道名</label>
        <input id="motifPos" spellcheck="false" autocomplete="off">
      </div>
      <div class="modal-row">
        <label for="motifNeg">负链轨道名</label>
        <input id="motifNeg" spellcheck="false" autocomplete="off">
      </div>
      <div class="modal-err" id="motifErr" hidden></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="motifCancel">取消</button>
      <button class="btn pri" id="motifOk">确定</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple hidden
       accept=".bw,.bigwig,.bedgraph,.bdg,.bam,.gtf,.gff,.gff3,.bed,.narrowPeak,.broadPeak,.fa,.fasta,.fna,.fas,.gz,.bgz">

<script>
// 崩溃上报：桌面版没有控制台，页面里的异常落到 <data>/client.log。
// 只在同源 http(s) 下工作；直接双击 index.html 打开时静默跳过。
(function () {
  var seen = 0;
  function report(kind, msg, src, stack) {
    if (seen++ > 20) return;                       // 死循环报错时别把磁盘写满
    try {
      fetch('/api/clientlog', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ kind: kind, msg: String(msg || ''), src: String(src || ''),
                               stack: String(stack || '').slice(0, 4000),
                               ua: navigator.userAgent, url: location.href })
      }).catch(function () {});
    } catch (e) { /* ignore */ }
  }
  window.addEventListener('error', function (e) {
    report('error', e.message, (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0),
           e.error && e.error.stack);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    report('rejection', r.message || r, '', r.stack);
  });
})();
</script>
<script src="vexport.js"></script>
<script src="app.js"></script>
</body>
</html>
