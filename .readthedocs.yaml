# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The English site is built from this repository directly. The Chinese site is a
# separate Read the Docs project registered as a translation of this one, pointing
# at the same repository — it builds with the same config, and Sphinx picks up the
# gettext catalogues under docs/locale/zh_CN because Read the Docs sets the
# language for us.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # A page that fails to render should fail the build rather than ship broken.
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
